services:
  db:
    container_name: jobcopilot-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: jobcopilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d jobcopilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobcopilot-net

  redis:
    container_name: jobcopilot-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobcopilot-net

  chroma:
    container_name: jobcopilot-chroma
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    networks:
      - jobcopilot-net

  backend:
    container_name: jobcopilot-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/jobcopilot
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_BEAT_BACKEND=redis://redis:6379/3
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - jobcopilot-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    container_name: jobcopilot-celery-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/jobcopilot
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_BEAT_BACKEND=redis://redis:6379/3
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    networks:
      - jobcopilot-net
    command: celery -A app.tasks worker --loglevel=info --concurrency=4

  celery-beat:
    container_name: jobcopilot-celery-beat
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/jobcopilot
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_BEAT_BACKEND=redis://redis:6379/3
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    volumes:
      - ./backend:/app
    depends_on:
      - celery-worker
    networks:
      - jobcopilot-net
    command: celery -A app.tasks beat --loglevel=info

  frontend:
    container_name: jobcopilot-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8001
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - jobcopilot-net

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  backend_uploads:

networks:
  jobcopilot-net:
    driver: bridge
